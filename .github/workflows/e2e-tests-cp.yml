name: Run E2E Tests (Customer Platform)

# Branch protection requires `E2E (CP) / Cypress Tests`. Drafts run nothing until marked ready.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: e2e-cp-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cypress-run:
    name: E2E (CP)
    uses: ./.github/workflows/e2e-tests-base.yml
    with:
      directory: ./modules/customerPlatform
      artifact-suffix: cp
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
