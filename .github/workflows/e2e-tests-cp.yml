name: Run E2E Tests (Customer Platform)

# Runs on every PR by default — the CP suite is part of the review signal, not an
# opt-in extra. Label a PR `Skip E2E` to skip both suites, or `Skip E2E: CP` to skip
# only this one (label changes re-evaluate, so removing a label runs the suite).
# Branch protection requires the `E2E CP` check, not the Cypress job: on a ready PR it
# goes red whenever the suite is skipped, failed or cancelled, so a label only defers
# the run — it never lets a PR merge without a green suite. On a draft both jobs are
# skipped (not red); marking it ready fires `ready_for_review`, which runs both for real.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: e2e-cp-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cypress-run:
    uses: ./.github/workflows/e2e-tests-base.yml
    with:
      directory: ./modules/customerPlatform
      artifact-suffix: cp
    if: |
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       !contains(github.event.pull_request.labels.*.name, 'Skip E2E') &&
       !contains(github.event.pull_request.labels.*.name, 'Skip E2E: CP'))

  gate:
    name: E2E CP
    needs: cypress-run
    if: always() && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Require a green suite
        env:
          RESULT: ${{ needs.cypress-run.result }}
        run: |
          echo "Cypress result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::E2E suite did not pass ($RESULT). A skipped run (Skip E2E label) still blocks merging — remove the label and let it run."
            exit 1
          fi
