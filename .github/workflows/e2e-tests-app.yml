name: Run E2E Tests (App)

# Branch protection requires `E2E (App) / Cypress Tests`. A `Skip E2E` or `Skip E2E: App`
# label turns that check red instead of running the suite, so a label only defers the
# run — it never lets a PR merge without a green suite.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: e2e-app-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cypress-run:
    name: E2E (App)
    uses: ./.github/workflows/e2e-tests-base.yml
    with:
      directory: ./modules/app
      artifact-suffix: app
      skip-reason: >-
        ${{ contains(github.event.pull_request.labels.*.name, 'Skip E2E') && 'Skip E2E'
        || contains(github.event.pull_request.labels.*.name, 'Skip E2E: App') && 'Skip E2E: App'
        || '' }}
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
