name: Run Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Typecheck & Unit Tests
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Cache NPM dependencies & vite build cache
        id: cache-npm-deps
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            modules/**/node_modules
            ~/.cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', 'base.vite.config.ts', 'modules/**/vite.config.ts') }}

      - name: Install dependencies
        if: steps.cache-npm-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test
